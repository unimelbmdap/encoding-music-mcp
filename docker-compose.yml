services:
  mcp:
    build: .
    restart: unless-stopped
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      # The backend is only exposed to Caddy, so forwarded proxy headers are trusted.
      - MCP_FORWARDED_ALLOW_IPS=*
      # Must exceed Caddy's 30-second upstream keep-alive.
      - MCP_HTTP_KEEP_ALIVE=35
      - MCP_ANALYSIS_CONCURRENCY=2
      - MCP_NOTATION_PROCESS_CONCURRENCY=2
      - MCP_AUDIO_RENDER_CONCURRENCY=1
      - MCP_RESULT_CACHE_SIZE=32
    expose:
      - "8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mcp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
